<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes" />
  <meta name="screen-orientation" content="portrait">
  <title>Maze | Unity WebGL in Telegram</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      position: fixed;
    }

    /* Контейнер занимает всю высоту и центрирует содержимое */
    #unity-container {
      position: fixed;
      width: 100vw;
      height: 100vh;
      top: 0;
      left: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Canvas управляется Unity - НЕ ТРОГАЕМ его стили */
    #unity-canvas {
      background: #000;
    }

    /* Сообщение для горизонтальной ориентации */
    #orientation-warning {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: white;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    #orientation-warning .icon {
      font-size: 48px;
      margin-bottom: 20px;
    }

    /* При горизонтальной ориентации показываем сообщение */
    @media (orientation: landscape) {
      #unity-container {
        display: none !important;
      }
      
      #orientation-warning {
        display: flex !important;
      }
    }

    /* Анимированный загрузочный экран */
    #unity-loading-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      max-width: 300px;
      text-align: center;
      color: white;
      font-family: Arial, sans-serif;
      background: rgba(0, 0, 0, 0.8);
      padding: 40px 30px;
      border-radius: 20px;
      border: 2px solid transparent;
      animation: borderGlow 2s infinite alternate;
      z-index: 1000;
    }

    @keyframes borderGlow {
      0% { border-color: #ff0080; box-shadow: 0 0 20px rgba(255, 0, 128, 0.3); }
      100% { border-color: #8000ff; box-shadow: 0 0 30px rgba(128, 0, 255, 0.5); }
    }

    #unity-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px auto;
      background: linear-gradient(135deg, #ff0080, #8000ff);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      animation: logoSpin 3s infinite linear;
      box-shadow: 0 0 20px rgba(255, 0, 128, 0.5);
    }

    @keyframes logoSpin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(1); }
    }

    #loading-text {
      font-size: 18px;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #ff0080, #8000ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textPulse 1.5s infinite alternate;
    }

    @keyframes textPulse {
      0% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    #unity-progress-bar-empty {
      width: 100%;
      height: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff0080, #8000ff);
      border-radius: 10px;
      transition: width 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    #unity-progress-bar-full::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      animation: progressShine 1.5s infinite;
    }

    @keyframes progressShine {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    #progress-percent {
      margin-top: 10px;
      font-size: 14px;
      color: #ccc;
    }

    #unity-warning {
      position: absolute;
      left: 50%;
      top: 5%;
      transform: translateX(-50%);
      background: #cc0000;
      padding: 10px;
      border-radius: 5px;
      color: white;
      display: none;
      z-index: 1001;
    }
  </style>
</head>
<body>
  <div id="orientation-warning">
    <div class="icon">📱</div>
    <h2>Пожалуйста, поверните устройство</h2>
    <p>Игра работает только в вертикальной ориентации</p>
  </div>

  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo">M</div>
      <div id="loading-text">Загрузка игры</div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div id="progress-percent">0%</div>
    </div>
    <div id="unity-warning"></div>
  </div>

  <script>
    // Простая блокировка ориентации
    function handleOrientation() {
      const warning = document.getElementById('orientation-warning');
      const container = document.getElementById('unity-container');
      
      const isLandscape = window.innerWidth > window.innerHeight;
      
      if (isLandscape) {
        warning.style.display = 'flex';
        container.style.display = 'none';
      } else {
        warning.style.display = 'none';
        container.style.display = 'flex';
      }
    }

    // Инициализация
    document.addEventListener('DOMContentLoaded', function() {
      handleOrientation();
      window.addEventListener('resize', handleOrientation);
      window.addEventListener('orientationchange', function() {
        setTimeout(handleOrientation, 100);
      });
    });

    // Оригинальный код Unity БЕЗ ИЗМЕНЕНИЙ
    const canvas = document.getElementById('unity-canvas');
    const loadingBar = document.getElementById('unity-loading-bar');
    const progressBarFull = document.getElementById('unity-progress-bar-full');
    const progressPercent = document.getElementById('progress-percent');
    const warningBanner = document.getElementById('unity-warning');

    function unityShowBanner(msg, type) {
      function updateBanner() {
        warningBanner.style.display = 'block';
      }
      if (type == 'error') {
        const lines = msg.split('\n');
        for (let i = 0; i < lines.length; i++) {
          const div = document.createElement('div');
          div.textContent = lines[i];
          warningBanner.appendChild(div);
        }
        updateBanner();
      } else {
        updateBanner();
      }
    }

    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/Telegram.loader.js";
    const config = {
      dataUrl: buildUrl + "/Telegram.data",
      frameworkUrl: buildUrl + "/Telegram.framework.js",
      codeUrl: buildUrl + "/Telegram.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Maze",
      productVersion: "1.0",
      showBanner: unityShowBanner,
    };

    loadingBar.style.display = "block";

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = 100 * progress + "%";
        progressPercent.textContent = Math.round(100 * progress) + "%";
      }).then((unityInstance) => {
        loadingBar.style.display = "none";
        
        // Устанавливаем правильный размер canvas после загрузки Unity
        setTimeout(() => {
          if (window.innerHeight > window.innerWidth) {
            // Портретная ориентация - позволяем Unity управлять размерами
            canvas.style.width = '100%';
            canvas.style.height = '100%';
          }
        }, 100);
        
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
